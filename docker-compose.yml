services:
  serioussportsync:
    container_name: serioussportsync
    image: ghcr.io/monkfish1337/serioussportsync:latest
    restart: unless-stopped
    env_file:
      - .env
    environment:
      # Defaults — env_file overrides these. Listed here so the schema is
      # discoverable without opening .env.example.
      PORT: "7000"
      ADDON_TYPE: "${ADDON_TYPE:-movie}"
      TSDB_API_KEY: "${TSDB_API_KEY:-123}"
      TSDB_SEASONS: "${TSDB_SEASONS:-auto}"
      REFRESH_INTERVAL_HOURS: "${REFRESH_INTERVAL_HOURS:-6}"
      # Content discovery. The companion can combine Prowlarr/Zilean/etc;
      # a direct Prowlarr connection can also be saved in the admin panel.
      COMPANION_URL: "${COMPANION_URL:-}"
      COMPANION_AUTH_TOKEN: "${COMPANION_AUTH_TOKEN:-}"
      # Accounts
      SESSION_SECRET: "${SESSION_SECRET:?Set SESSION_SECRET in .env}"
      ADMIN_USER: "${ADMIN_USER:-}"
    volumes:
      - serioussportsync_data:/app/data
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    ports:
      # Keep direct origin access on this host. Put a reverse proxy or
      # Cloudflare Tunnel in front instead of exposing port 7000 to the LAN.
      - "${SSS_BIND_ADDRESS:-127.0.0.1}:${SSS_HOST_PORT:-7000}:7000"

volumes:
  serioussportsync_data:

# To attach to an existing reverse-proxy / *arr stack network instead of the
# default compose-created one, uncomment and replace the name below.
# networks:
#   default:
#     external: true
#     name: my-existing-network
