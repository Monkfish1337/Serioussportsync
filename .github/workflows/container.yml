name: Publish container

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: monkfish1337/serioussportsync
  # Compose evaluates required substitutions for every command, including
  # failure logs and cleanup. This value exists only on the disposable runner.
  SESSION_SECRET: ci-only-do-not-use-in-prod-0000000000000000000000000000000000
  ADMIN_USER: ci-admin

jobs:
  publish-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Verify before publishing
        run: |
          npm ci --no-audit --no-fund
          npm audit --omit=dev --audit-level=moderate
          npm run test:unit
          npm run test:nuvio
          npm run test:account

      - uses: docker/setup-buildx-action@v3

      - name: Sign in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate image tags and labels
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=ref,event=tag
            type=sha
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}

      - name: Build and publish image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Verify public image through Compose
        if: github.ref == 'refs/heads/main'
        run: |
          cp .env.example .env
          docker logout ghcr.io
          docker compose pull
          docker compose up -d --wait --wait-timeout 120
          curl --fail --show-error --retry 5 --retry-delay 2 http://127.0.0.1:7000/health

      - name: Show container logs on failure
        if: failure() && github.ref == 'refs/heads/main'
        run: docker compose logs --no-color

      - name: Stop test stack
        if: always() && github.ref == 'refs/heads/main'
        run: docker compose down --volumes --remove-orphans
